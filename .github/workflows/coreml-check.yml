name: Core ML download check (temporary)

# Native Core ML stem models for INTERSECT on Macs (issue 63). Lives only on feat/coreml-poc and is removed
# before merging. Checks the published v0.2.4 release the way INTERSECT gets it: the plugin's own download
# job fetches the manifest, the ONNX file and the Core ML zip, then the stem job runs on Core ML.
on:
  push:
    branches: ['feat/coreml-poc']

jobs:
  download-macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          repository: tucktuckg00se/INTERSECT
          ref: fix/macos-stem-speed
          path: plugin
          submodules: recursive
      - name: Machine
        run: sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; df -h ~
      # github.com/microsoft/onnxruntime returned 404 in Nov 2026: same 1.24.2 headers from intersect-tools.
      - name: Build the plugin's stem bench
        working-directory: plugin
        run: |
          curl -sSfL -o ort.zip https://github.com/tucktuckg00se/intersect-tools/releases/download/ort-1.24.2/onnxruntime-macos-arm64.zip
          mkdir ort && unzip -q ort.zip -d ort
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DINTERSECT_BUILD_TESTS=ON -DINTERSECT_ORT_HEADERS_ROOT=$PWD/ort
          cmake --build build --config Release --target IntersectStemBench -j4
      - name: Fresh install (Mega) and UPDATE (SW without its Core ML package)
        run: |
          B=$(find plugin/build -name IntersectStemBench -type f -perm -u+x | head -1)
          M=~/Library/INTERSECT/models
          # The plugin finds the newest v0.2.x manifest through GitHub's API (unauthenticated, 60 an hour per IP)
          # and falls back to v0.2.1's when that fails. Show what's left before each run, and what got cached.
          api () { curl -s https://api.github.com/rate_limit | python3 -c 'import json,sys; r=json.load(sys.stdin)["resources"]["core"]; print("GitHub API left for this runner:", r["remaining"], "of", r["limit"])' || true; }
          cached () { python3 - "$M/intersect_stem_models_manifest-v0.2.json" <<'PY2' || true
          import json, sys
          m = json.load(open(sys.argv[1]))
          print("cached manifest Core ML:", {e["model_id"]: bool(e.get("artifacts", {}).get("coreml")) for e in m["models"]})
          PY2
          }
          run () { api; echo "::group::$*"; "$B" "$@" timeout=2400 2>&1 | tee -a bench.log | grep -v '^  \[' ; echo "::endgroup::"; cached; }
          expect () { grep -qF -- "$1" bench.log && echo "ok: $1" || { echo "::error::missing: $1"; fail=1; }; }
          fail=0

          # A Mac that never had the model: one download brings the ONNX file and the Core ML package.
          run mvsep-mega-53 gpu gen:10 out-mega
          expect "MVSep Mega 53 (mvsep_mega_53.onnx) on GPU (Core ML, mvsep_mega_53.mlpackage)"
          expect "RESULT model=mvsep-mega-53 device=gpu status=ok"

          # A model installed before its Core ML version existed: the bench runs the UPDATE download.
          run bs-roformer-sw-6stem cpu gen:5 out-sw-cpu
          ls -d "$M/bs_roformer_sw_6stem.mlpackage" && rm -rf "$M/bs_roformer_sw_6stem.mlpackage"
          : > bench.log
          run bs-roformer-sw-6stem gpu gen:20 out-sw-gpu
          expect "Model bs-roformer-sw-6stem: Model download complete"
          expect "BS RoFormer SW by jarredou (bs_roformer_sw_6stem_dml.onnx) on GPU (Core ML, bs_roformer_sw_6stem.mlpackage)"
          expect "RESULT model=bs-roformer-sw-6stem device=gpu status=ok"

          ls -la "$M"
          echo "---- stem log"; grep -E -- '----|Core ML|done|FAILED' ~/Library/INTERSECT/logs/stem-separation.log | tail -20
          exit $fail
