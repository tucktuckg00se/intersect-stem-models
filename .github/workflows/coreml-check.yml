name: Core ML conversion check (temporary)

# Proof of concept for native Core ML stem models (INTERSECT issue 63). Lives only on feat/coreml-poc.
on:
  push:
    branches: ['feat/coreml-poc']

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --quiet -r scripts/coreml/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Sources
        run: |
          mkdir -p src-models out
          # Mini-BS-RoFormer V2.5 at the MIT-licensed revision (later revisions are CC-BY-NC-4.0)
          curl -sSfL --http1.1 --retry 5 --retry-all-errors -o src-models/mini_upstream.onnx \
            https://huggingface.co/HiDolen/Mini-BS-RoFormer-V2.5-46.2M/resolve/38dafc78834607aec57d8c0cb3568523f9ea5563/onnx/freq_weights.onnx
          curl -sSfL --retry 5 -o src-models/scnet.onnx \
            https://github.com/tucktuckg00se/intersect-stem-models/releases/download/v0.2.1/scnet_int8_dml.onnx
          echo "c019650a7fb9e6a208353fead62471ed6ffdf20a3069ddadd8278edeb411d556  src-models/mini_upstream.onnx" | sha256sum -c
          echo "86c35a1f513de688149d5a36c16a0bb1c67c60dcdfa01563ffda7e73708676db  src-models/scnet.onnx" | sha256sum -c
      - name: Convert
        run: |
          python -W ignore scripts/coreml/convert_coreml.py src-models/mini_upstream.onnx out/mini_bs_roformer_v25.mlpackage 1,690,8196 2>&1 | grep -E '^(input|opset|PyTorch|saved)'
          python -W ignore scripts/coreml/convert_coreml.py src-models/scnet.onnx out/scnet.mlpackage 1,4,2049,476 2>&1 | grep -E '^(input|opset|PyTorch|saved)'
          du -sh out/*
      - uses: actions/upload-artifact@v5
        with:
          name: coreml-models
          path: out/

  verify-macos:
    needs: convert
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet coremltools==9.0 numpy onnxruntime==1.24.2
      - uses: actions/download-artifact@v5
        with:
          name: coreml-models
          path: out
      - name: Machine
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          sysctl hw.perflevel0.physicalcpu hw.perflevel1.physicalcpu 2>/dev/null || true
          system_profiler SPDisplaysDataType 2>/dev/null | grep -E 'Chipset|Metal|Cores|Vendor' || echo "(no GPU listed)"
      - name: ONNX Runtime CPU on the same machine (INTERSECT's settings)
        run: |
          mkdir -p src-models
          curl -sSfL --http1.1 --retry 5 --retry-all-errors -o src-models/mini_upstream.onnx \
            https://huggingface.co/HiDolen/Mini-BS-RoFormer-V2.5-46.2M/resolve/38dafc78834607aec57d8c0cb3568523f9ea5563/onnx/freq_weights.onnx
          curl -sSfL --retry 5 -o src-models/scnet.onnx https://github.com/tucktuckg00se/intersect-stem-models/releases/download/v0.2.1/scnet_int8_dml.onnx
          python - <<'PY'
          import os, time, numpy as np, onnxruntime as ort
          for name, path, pkg in (("scnet", "src-models/scnet.onnx", "out/scnet.mlpackage"),
                                  ("mini", "src-models/mini_upstream.onnx", "out/mini_bs_roformer_v25.mlpackage")):
              so = ort.SessionOptions(); so.intra_op_num_threads = max(1, os.cpu_count() - 1)
              so.graph_optimization_level = ort.GraphOptimizationLevel.ORT_ENABLE_ALL; so.log_severity_level = 3
              s = ort.InferenceSession(path, so, providers=["CPUExecutionProvider"])
              x = np.load(pkg + ".ref_input.npy")
              t = []
              for _ in range(3):
                  a = time.time(); s.run(None, {s.get_inputs()[0].name: x}); t.append(time.time() - a)
              print(f"ORT CPU {name}: {min(t):.2f} s per segment ({os.cpu_count()} cores)")
          PY
      - name: Verify Core ML against ONNX Runtime
        run: |
          rc=0
          for m in out/scnet.mlpackage out/mini_bs_roformer_v25.mlpackage; do
            python -W ignore scripts/coreml/verify_coreml.py "$m" cpu_and_gpu 2>&1 | grep -E '^RESULT|Error|error' || rc=1
          done
          exit $rc
